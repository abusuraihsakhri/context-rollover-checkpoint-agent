[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-rollover-checkpoint-engine"
version = "2.0.0"
description = "Checkpoint, trigger, diff, and local task-evaluation utilities for long-running context workflows."
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
test = [
    "pytest>=8,<10",
]

[project.scripts]
context-rollover-checkpoint-engine = "context_rollover.cli:main"
context-rollover-checkpoint-agent = "context_rollover.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/context-rollover-checkpoint-agent"
Repository = "https://github.com/abusuraihsakhri/context-rollover-checkpoint-agent.git"

[tool.setuptools]
packages = ["agents", "context_rollover"]
py-modules = [
    "cli",
    "context_rollover_app",
    "context_rollover_checkpoint",
    "enrichment",
    "simulator",
]
