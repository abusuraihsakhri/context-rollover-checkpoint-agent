[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "context-rollover-checkpoint-engine"
version = "2.0.0"
description = "ContextRollover Sentinel: Long-Horizon Engine State Checkpointer & Delta Restorer"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
context-rollover-checkpoint-engine = "context_rollover.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/context-rollover-checkpoint-engine"
Repository = "https://github.com/abusuraihsakhri/context-rollover-checkpoint-engine.git"
