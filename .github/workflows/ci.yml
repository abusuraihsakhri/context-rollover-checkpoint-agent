name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents context_rollover cli.py context_rollover_app.py context_rollover_checkpoint.py enrichment.py simulator.py
      - name: Run tests
        run: pytest -q

  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"
          python -m pip check
      - name: Import API applications
        run: |
          python -c "from agents.api import app; assert app is not None"
          python -c "from context_rollover.server import create_app; assert create_app() is not None"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"
          python -m pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit

  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JavaScript syntax
        run: node --check web/app.js
      - name: Smoke-test static site
        run: |
          test -f index.html
          test -f web/styles.css
          test -f web/app.js
          grep -q 'id="analyzeButton"' index.html
          grep -q 'web/styles.css' index.html
          grep -q 'web/app.js' index.html
          python -m http.server 8080 --directory . >/tmp/context-rollover-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent http://127.0.0.1:8080/web/styles.css >/dev/null
          curl --fail --silent http://127.0.0.1:8080/web/app.js >/dev/null
