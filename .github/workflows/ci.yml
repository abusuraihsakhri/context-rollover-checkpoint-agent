name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q agents context_rollover cli.py context_rollover_app.py context_rollover_checkpoint.py enrichment.py simulator.py
      - name: Run tests
        run: pytest -q

  api-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"
          python -m pip check
      - name: Import API applications
        run: |
          python -c "from agents.api import app; assert app is not None"
          python -c "from context_rollover.server import create_app; assert create_app() is not None"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies and auditor
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]"
          python -m pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit
